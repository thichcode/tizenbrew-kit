<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShortVideo TV – Live Demo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #070707; color: #e8e8e8; min-height: 100vh;
    user-select: none; -webkit-user-select: none;
    outline: none; overflow: hidden;
  }
  .container { max-width: 600px; margin: 0 auto; padding: 24px 16px; }

  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header a { color: #666; font-size: 13px; text-decoration: none; margin-left: auto; }
  .header a:hover { color: #999; }

  .connect-card {
    background: #121212; border: 1px solid #222; border-radius: 12px;
    padding: 20px; text-align: center; margin-bottom: 24px;
  }
  .connect-card h2 { font-size: 16px; margin-bottom: 12px; }
  .connect-card input {
    width: 100%; max-width: 240px; padding: 12px 16px; border-radius: 8px;
    border: 1px solid #333; background: #0a0a0a; color: #fff;
    font-size: 18px; text-align: center; letter-spacing: 4px;
    text-transform: uppercase; outline: none;
  }
  .connect-card input:focus { border-color: #e94560; }
  .connect-card input::placeholder { color: #444; letter-spacing: 2px; text-transform: none; font-size: 14px; }
  .connect-card button {
    margin-top: 12px; padding: 10px 28px; border-radius: 8px;
    border: none; background: #e94560; color: #fff; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: background .2s;
  }
  .connect-card button:hover { background: #d63c55; }
  .connect-card button:disabled { background: #333; cursor: not-allowed; }
  .connect-card .error { color: #e94560; font-size: 13px; margin-top: 8px; min-height: 20px; }
  .connect-card .connected { color: #4caf50; font-size: 13px; margin-top: 8px; }

  .feed-list { display: none; flex-direction: column; gap: 8px; }
  .feed-item {
    background: #141414; border: 1px solid #1a1a1a; border-radius: 10px;
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: background .15s;
  }
  .feed-item { outline: none; }
  .feed-item.focused { background: #1c1c1c; border-color: #e94560; }
  .feed-item:hover { background: #1c1c1c; border-color: #333; }
  .feed-item:active { background: #222; }
  .feed-item-idx { color: #555; font-size: 13px; min-width: 24px; text-align: right; }
  .feed-item-info { flex: 1; min-width: 0; }
  .feed-item-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed-item-url { color: #555; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .feed-item-badge {
    font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap;
    background: #0d1a3a; color: #1877f2;
  }
  .feed-item-play {
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: #e94560; color: #fff; display: flex; align-items: center;
    justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .feed-item-play svg { width: 14px; height: 14px; fill: currentColor; }

  .empty-msg { text-align: center; color: #555; font-size: 14px; padding: 40px 0; }

  .player-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #000; z-index: 9999; flex-direction: column;
  }
  .player-overlay.active { display: flex; }
  .player-header {
    display: flex; align-items: center; padding: 12px 16px; gap: 12px;
    background: linear-gradient(rgba(0,0,0,0.8), transparent);
    position: absolute; top: 0; left: 0; right: 0; z-index: 1;
  }
  .player-back {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.1); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .player-back svg { width: 18px; height: 18px; fill: currentColor; }
  .player-title { font-size: 14px; font-weight: 600; color: #fff; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-video { flex: 1; width: 100%; background: #000; object-fit: contain; }
  .player-error { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #e94560; font-size: 14px; text-align: center; }

  .footer { text-align: center; padding: 32px 0; font-size: 12px; color: #444; }
  .footer a { color: #555; text-decoration: none; }
  .footer a:hover { color: #777; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>ShortVideo TV</h1>
    <a href="./">← Home</a>
  </div>

  <div class="connect-card" id="connectCard">
    <h2>Connect to your TV</h2>
    <input id="codeInput" type="text" placeholder="Enter device code" maxlength="12" autofocus />
    <div><button id="connectBtn" onclick="connect()">Connect</button></div>
    <div class="error" id="connectError"></div>
    <div class="connected" id="connectSuccess"></div>
  </div>

  <div class="feed-list" id="feedList"></div>
  <div class="empty-msg" id="emptyMsg" style="display:none">No videos in feed yet. Send reels from your phone!</div>
  <div id="dpadHelp" style="display:none;text-align:center;color:#444;font-size:11px;margin-top:16px;letter-spacing:0.03em">
    &#x2191;&#x2193; Navigate &nbsp; OK: Play &nbsp; Back: Close
  </div>

  <div class="footer">
    <a href="https://github.com/thichcode/tizenbrew-kit" target="_blank">GitHub</a>
    &nbsp;·&nbsp;
    <a href="https://www.npmjs.com/package/shortvideo-tv" target="_blank">npm</a>
  </div>

</div>

<div class="player-overlay" id="playerOverlay">
  <div class="player-header">
    <button class="player-back" onclick="closePlayer()">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="player-title" id="playerTitle"></div>
  </div>
  <video class="player-video" id="playerVideo" controls playsinline></video>
  <div class="player-error" id="playerError" style="display:none"></div>
</div>

<script>
  var WORKER_URL = 'https://shortvideo-feed.dvt-kisu.workers.dev';
  var deviceCode = '';
  var feedItems = [];
  var pollTimer = null;
  var selectedIndex = 0;
  var isPlayerOpen = false;

  var codeInput = document.getElementById('codeInput');
  var connectBtn = document.getElementById('connectBtn');
  var connectError = document.getElementById('connectError');
  var connectSuccess = document.getElementById('connectSuccess');
  var feedList = document.getElementById('feedList');
  var emptyMsg = document.getElementById('emptyMsg');
  var playerOverlay = document.getElementById('playerOverlay');
  var playerVideo = document.getElementById('playerVideo');
  var playerTitle = document.getElementById('playerTitle');
  var playerError = document.getElementById('playerError');
  var dpadHelp = document.getElementById('dpadHelp');

  codeInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') connect();
  });

  function connect() {
    var code = codeInput.value.trim().toUpperCase();
    if (!code || !/^[A-Z0-9]{4,12}$/.test(code)) {
      connectError.textContent = 'Invalid code (4-12 letters/numbers)';
      return;
    }
    connectError.textContent = '';
    connectBtn.disabled = true;
    connectBtn.textContent = 'Connecting...';

    deviceCode = code;
    fetchFeed().then(function() {
      connectSuccess.textContent = 'Connected to ' + code;
      connectBtn.disabled = false;
      connectBtn.textContent = 'Reconnect';
      dpadHelp.style.display = 'block';
      pollTimer = setInterval(fetchFeed, 8000);
    }).catch(function(err) {
      connectError.textContent = 'Cannot connect: ' + err.message;
      connectBtn.disabled = false;
      connectBtn.textContent = 'Connect';
    });
  }

  function fetchFeed() {
    return fetch(WORKER_URL + '/feed?code=' + encodeURIComponent(deviceCode))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        feedItems = (data.items || []).filter(function(it) {
          return it && it.id && it.title && it.source !== 'TikTok' &&
            /^https?:\/\//.test(it.videoUrl || '');
        }).map(function(it) {
          return {
            id: it.id, title: it.title, source: it.source,
            sourceUrl: it.sourceUrl || '', videoUrl: it.videoUrl || '',
            thumbnailUrl: it.thumbnailUrl || ''
          };
        });
        renderFeed();
      });
  }

  function renderFeed() {
    feedList.innerHTML = '';
    if (!feedItems.length) {
      feedList.style.display = 'none';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';
    feedList.style.display = 'flex';

    feedItems.forEach(function(item, i) {
      var el = document.createElement('div');
      el.className = 'feed-item';
      el.setAttribute('data-index', i);

      var idx = document.createElement('span');
      idx.className = 'feed-item-idx';
      idx.textContent = (i + 1);

      var info = document.createElement('div');
      info.className = 'feed-item-info';
      var title = document.createElement('div');
      title.className = 'feed-item-title';
      title.textContent = item.title || '(untitled)';
      var url = document.createElement('div');
      url.className = 'feed-item-url';
      url.textContent = item.sourceUrl || item.videoUrl;
      info.appendChild(title);
      info.appendChild(url);

      var badge = document.createElement('span');
      badge.className = 'feed-item-badge';
      badge.textContent = item.source;

      var playBtn = document.createElement('button');
      playBtn.className = 'feed-item-play';
      playBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
      playBtn.onclick = function(e) { e.stopPropagation(); playItem(item); };

      el.appendChild(idx);
      el.appendChild(info);
      el.appendChild(badge);
      el.appendChild(playBtn);
      el.onclick = function() { playItem(item); };
      feedList.appendChild(el);
    });

    if (selectedIndex >= feedItems.length) selectedIndex = feedItems.length - 1;
    if (selectedIndex < 0) selectedIndex = 0;
    focusSelected();
  }

  function focusSelected() {
    var nodes = feedList.querySelectorAll('.feed-item');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].classList.toggle('focused', i === selectedIndex);
    }
    if (nodes[selectedIndex]) {
      nodes[selectedIndex].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function playItem(item) {
    playerTitle.textContent = item.title || 'Playing...';
    playerError.style.display = 'none';
    playerVideo.style.display = 'block';
    playerOverlay.classList.add('active');
    isPlayerOpen = true;

    if (item.videoUrl && item.videoUrl !== item.sourceUrl) {
      playerVideo.src = item.videoUrl;
      playerVideo.play().catch(function() {});
    } else {
      var proxyUrl = WORKER_URL + '/proxy?url=' + encodeURIComponent(item.sourceUrl);
      playerVideo.src = proxyUrl;
      playerVideo.play().catch(function() {});
    }
  }

  function closePlayer() {
    isPlayerOpen = false;
    playerOverlay.classList.remove('active');
    playerVideo.pause();
    playerVideo.removeAttribute('src');
    playerVideo.load();
  }

  document.addEventListener('keydown', function(e) {
    if (isPlayerOpen) {
      if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'XF86Back') {
        e.preventDefault();
        closePlayer();
      }
      return;
    }

    if (!feedItems.length) return;

    switch (e.key) {
      case 'ArrowUp':
      case 'Up':
        e.preventDefault();
        if (selectedIndex > 0) {
          selectedIndex--;
          focusSelected();
        }
        break;
      case 'ArrowDown':
      case 'Down':
        e.preventDefault();
        if (selectedIndex < feedItems.length - 1) {
          selectedIndex++;
          focusSelected();
        }
        break;
      case 'ArrowLeft':
      case 'Left':
        e.preventDefault();
        selectedIndex = 0;
        focusSelected();
        break;
      case 'ArrowRight':
      case 'Right':
        e.preventDefault();
        selectedIndex = feedItems.length - 1;
        focusSelected();
        break;
      case 'Enter':
      case 'OK':
      case 'Select':
        e.preventDefault();
        playItem(feedItems[selectedIndex]);
        break;
    }
  });

  // Check URL params for auto-connect
  (function() {
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    if (code && /^[A-Z0-9]{4,12}$/i.test(code)) {
      codeInput.value = code.toUpperCase();
      connect();
    }
  })();
</script>
</body>
</html>
